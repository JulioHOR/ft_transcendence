asyncapi: "3.0.0"
info:
  title: ft_transcendence WebSocket
  version: 1.0.0
  description: |
    Eventos Socket.IO (flask-socketio, namespace padrão `/`) da fila de
    matchmaker e da partida de Pong, dos canais de chat (público e privado) e
    da lista de amigos com presença.

    Convenção de direção: o documento descreve o servidor. `action: receive`
    são eventos enviados pelo cliente ao servidor; `action: send` são eventos
    emitidos pelo servidor ao cliente.

    Enquadramento Socket.IO: sobre o WebSocket cada evento é uma moldura cujo
    payload é um array JSON `[nomeDoEvento, dados]`. Os handlers de
    `queue:join` e `queue:leave` respondem pelo callback de ack do Socket.IO;
    aqui essas respostas aparecem como mensagens de reply do próprio evento.

    Estado da partida: `game:snapshot` chega a 30 Hz para os dois jogadores da
    sala da partida. Coordenadas são centradas na mesa; `winner` vale `left`,
    `right` ou `null`.
servers:
  backend:
    host: "{host}"
    pathname: /socket.io/
    protocol: socketio
    variables:
      host:
        default: localhost:8080
        description: Host do backend exposto pelo nginx.
channels:
  matchmaking:
    address: /
    title: Canal único do namespace Socket.IO
    description: |
      Todos os eventos compartilham o namespace `/`. Uma conexão representa um
      jogador identificado pelo `sid` do Socket.IO.
    messages:
      queueJoin:
        $ref: "#/components/messages/queueJoin"
      queueLeave:
        $ref: "#/components/messages/queueLeave"
      paddleInput:
        $ref: "#/components/messages/paddleInput"
      gameRematch:
        $ref: "#/components/messages/gameRematch"
      disconnect:
        $ref: "#/components/messages/disconnect"
      gameStatus:
        $ref: "#/components/messages/gameStatus"
      gameSnapshot:
        $ref: "#/components/messages/gameSnapshot"
      gameError:
        $ref: "#/components/messages/gameError"
  chat:
    address: /
    title: Chat público e privado
    description: |
      Eventos de chat no namespace `/`. Uma conexão com cookie de sessão do
      Flask no handshake entra na sala `user:{id}` e recebe as mensagens
      endereçadas a ela; conexões sem sessão entram sem identidade e têm os
      eventos de chat ignorados.
    messages:
      chatSend:
        $ref: "#/components/messages/chatSend"
      chatPrivateSend:
        $ref: "#/components/messages/chatPrivateSend"
      chatPrivateTypingRequest:
        $ref: "#/components/messages/chatPrivateTypingRequest"
      chatPrivateReadRequest:
        $ref: "#/components/messages/chatPrivateReadRequest"
      chatMessage:
        $ref: "#/components/messages/chatMessage"
      chatPrivateMessage:
        $ref: "#/components/messages/chatPrivateMessage"
      chatPrivateError:
        $ref: "#/components/messages/chatPrivateError"
      chatPrivateTypingRelay:
        $ref: "#/components/messages/chatPrivateTypingRelay"
      chatPrivateReadRelay:
        $ref: "#/components/messages/chatPrivateReadRelay"
      chatGameInvite:
        $ref: "#/components/messages/chatGameInvite"
      chatGameInviteResponse:
        $ref: "#/components/messages/chatGameInviteResponse"
      chatGameInviteCancel:
        $ref: "#/components/messages/chatGameInviteCancel"
      chatGameInviteIncoming:
        $ref: "#/components/messages/chatGameInviteIncoming"
      chatGameInviteUpdate:
        $ref: "#/components/messages/chatGameInviteUpdate"
  friends:
    address: /
    title: Lista de amigos e presença
    description: |
      Lista completa de amigos do usuário com sessão (substituição total): sai
      quando a pessoa conecta, após cada mudança de amizade, foto ou apelido e
      a cada mudança de presença.
    messages:
      friendsUpdate:
        $ref: "#/components/messages/friendsUpdate"
operations:
  joinQueue:
    action: receive
    channel:
      $ref: "#/channels/matchmaking"
    summary: Cliente entra na fila de matchmaker
    description: |
      Sem payload para partidas abertas. Convites aceitos incluem `inviteId`;
      somente as duas pessoas convidadas podem entrar. Quando ambas entram,
      a partida começa e o servidor emite `game:status` com `state: countdown`.
      Se o cliente já estiver na fila ou em partida, o servidor emite `game:error`
      com `reason: already_playing` e o ack é omitido.
    messages:
      - $ref: "#/channels/matchmaking/messages/queueJoin"
  leaveQueue:
    action: receive
    channel:
      $ref: "#/channels/matchmaking"
    summary: Cliente sai da fila de espera
    description: |
      Sem payload. Fora da fila o servidor emite `game:error` com
      `reason: invalid` e o ack é omitido.
    messages:
      - $ref: "#/channels/matchmaking/messages/queueLeave"
  sendPaddleInput:
    action: receive
    channel:
      $ref: "#/channels/matchmaking"
    summary: Cliente envia a posição desejada da própria raquete
    description: |
      `offset` é limitado à metade da largura da mesa menos a meia profundidade
      da raquete; fora disso é ajustado (clamp), não rejeitado. Payload
      malformado gera `game:error` com `reason: malformed`; jogador fora de
      partida gera `reason: not_in_match`; partida encerrada gera
      `reason: invalid`. Não há ack.
    messages:
      - $ref: "#/channels/matchmaking/messages/paddleInput"
  requestRematch:
    action: receive
    channel:
      $ref: "#/channels/matchmaking"
    summary: Cliente reinicia a partida encerrada
    description: |
      Sem payload. Só vale após o fim da partida: o estado zera e o servidor
      emite `game:status` com `state: playing`. Fora de partida gera
      `reason: not_in_match`; partida ainda em jogo gera `reason: invalid`.
    messages:
      - $ref: "#/channels/matchmaking/messages/gameRematch"
  clientDisconnect:
    action: receive
    channel:
      $ref: "#/channels/matchmaking"
    summary: Conexão do cliente encerra
    description: |
      Sem payload. Na fila, o cliente sai dela. Em partida, o adversário recebe
      `game:status` com `state: opponent_left` e a partida é destruída.
    messages:
      - $ref: "#/channels/matchmaking/messages/disconnect"
  sendGameStatus:
    action: send
    channel:
      $ref: "#/channels/matchmaking"
    summary: Servidor muda o estado da partida
    messages:
      - $ref: "#/channels/matchmaking/messages/gameStatus"
  sendGameSnapshot:
    action: send
    channel:
      $ref: "#/channels/matchmaking"
    summary: Servidor envia o quadro da simulação
    messages:
      - $ref: "#/channels/matchmaking/messages/gameSnapshot"
  sendGameError:
    action: send
    channel:
      $ref: "#/channels/matchmaking"
    summary: Servidor rejeita uma ação do cliente
    messages:
      - $ref: "#/channels/matchmaking/messages/gameError"
  chatSend:
    action: receive
    channel:
      $ref: "#/channels/chat"
    summary: Cliente envia mensagem no chat público
    description: |
      O servidor corta os espaços das bordas do texto. Texto vazio, payload
      malformado ou conexão sem identidade: o evento é ignorado. Com texto
      válido, grava no Postgres e emite `chat:message` para todas as conexões.
    messages:
      - $ref: "#/channels/chat/messages/chatSend"
  chatPrivateSend:
    action: receive
    channel:
      $ref: "#/channels/chat"
    summary: Cliente envia mensagem privada
    description: |
      Funciona só entre amigos. Sem amizade, o servidor responde ao emissor
      `chat:private:error`; com amizade, grava a mensagem e emite
      `chat:private:message` nas salas dos dois, e o mesmo objeto chega nos
      dois lados.
    messages:
      - $ref: "#/channels/chat/messages/chatPrivateSend"
  chatPrivateTyping:
    action: receive
    channel:
      $ref: "#/channels/chat"
    summary: Avisa que está digitando no chat privado
    description: |
      Entre amigos, o servidor repassa à sala do destinatário
      `chat:private:typing` com `userId`, `nickname` e `conversationId`.
      Sem amizade ou sem identidade, o evento é ignorado.
    messages:
      - $ref: "#/channels/chat/messages/chatPrivateTypingRequest"
  chatPrivateRead:
    action: receive
    channel:
      $ref: "#/channels/chat"
    summary: Confirma leitura no chat privado
    description: |
      `lastMessageId` é o id da última mensagem lida. O servidor repassa à
      sala do destinatário `chat:private:read`. Sem amizade, id válido ou
      identidade, o evento é ignorado.
    messages:
      - $ref: "#/channels/chat/messages/chatPrivateReadRequest"
  sendChatMessage:
    action: send
    channel:
      $ref: "#/channels/chat"
    summary: Servidor distribui mensagem do chat público
    description: Enviada a todas as conexões do namespace.
    messages:
      - $ref: "#/channels/chat/messages/chatMessage"
  sendChatPrivateMessage:
    action: send
    channel:
      $ref: "#/channels/chat"
    summary: Servidor entrega mensagem privada ao par
    messages:
      - $ref: "#/channels/chat/messages/chatPrivateMessage"
  sendChatPrivateError:
    action: send
    channel:
      $ref: "#/channels/chat"
    summary: Servidor avisa o emissor que a conversa privada não é permitida
    messages:
      - $ref: "#/channels/chat/messages/chatPrivateError"
  sendChatPrivateTypingRelay:
    action: send
    channel:
      $ref: "#/channels/chat"
    summary: Servidor entrega o indicador de digitação ao destinatário
    messages:
      - $ref: "#/channels/chat/messages/chatPrivateTypingRelay"
  sendChatPrivateReadRelay:
    action: send
    channel:
      $ref: "#/channels/chat"
    summary: Servidor entrega o recibo de leitura ao destinatário
    messages:
      - $ref: "#/channels/chat/messages/chatPrivateReadRelay"
  sendChatGameInvite:
    action: receive
    channel:
      $ref: "#/channels/chat"
    summary: Enviar convite de Pong pelo chat privado
    messages:
      - $ref: "#/channels/chat/messages/chatGameInvite"
  respondChatGameInvite:
    action: receive
    channel:
      $ref: "#/channels/chat"
    summary: Aceitar ou recusar convite de Pong
    messages:
      - $ref: "#/channels/chat/messages/chatGameInviteResponse"
  cancelChatGameInvite:
    action: receive
    channel:
      $ref: "#/channels/chat"
    summary: Cancelar convite de Pong
    messages:
      - $ref: "#/channels/chat/messages/chatGameInviteCancel"
  sendChatGameInviteIncoming:
    action: send
    channel:
      $ref: "#/channels/chat"
    summary: Servidor avisa o destinatário sobre um convite de Pong
    messages:
      - $ref: "#/channels/chat/messages/chatGameInviteIncoming"
  sendChatGameInviteUpdate:
    action: send
    channel:
      $ref: "#/channels/chat"
    summary: Servidor atualiza o estado do convite no chat
    messages:
      - $ref: "#/channels/chat/messages/chatGameInviteUpdate"
  sendFriendsUpdate:
    action: send
    channel:
      $ref: "#/channels/friends"
    summary: Servidor envia a lista completa de amigos e presença
    messages:
      - $ref: "#/channels/friends/messages/friendsUpdate"
components:
  messages:
    queueJoin:
      name: "queue:join"
      title: Entrar na fila
      description: |
        Resposta pelo callback de ack do Socket.IO: `{"status": "waiting"}`
        quando ainda falta adversário, `{"status": "matched"}` após iniciar
        partida aberta ou por convite. Partidas abertas usam `{}`; por convite,
        o payload contém `inviteId`.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/QueueJoinPayload"
    queueLeave:
      name: "queue:leave"
      title: Sair da fila
      description: 'Resposta pelo ack do Socket.IO: `{"status": "left"}`.'
      contentType: application/json
      payload:
        $ref: "#/components/schemas/EmptyPayload"
    paddleInput:
      name: "paddle:input"
      title: Input da raquete
      contentType: application/json
      payload:
        $ref: "#/components/schemas/PaddleInput"
    gameRematch:
      name: "game:rematch"
      title: Reiniciar partida
      contentType: application/json
      payload:
        $ref: "#/components/schemas/EmptyPayload"
    disconnect:
      name: disconnect
      title: Desconexão
      description: Evento do Socket.IO sem payload.
    gameStatus:
      name: "game:status"
      title: Estado da partida
      contentType: application/json
      payload:
        $ref: "#/components/schemas/GameStatus"
    gameSnapshot:
      name: "game:snapshot"
      title: Quadro da simulação
      contentType: application/json
      payload:
        $ref: "#/components/schemas/GameSnapshot"
    gameError:
      name: "game:error"
      title: Erro de jogo
      contentType: application/json
      payload:
        $ref: "#/components/schemas/GameError"
    chatSend:
      name: "chat:send"
      title: Enviar no chat público
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ChatSendPayload"
    chatPrivateSend:
      name: "chat:private:send"
      title: Enviar no chat privado
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ChatPrivateSendPayload"
    chatPrivateTypingRequest:
      name: "chat:private:typing"
      title: Digitando (pedido do cliente)
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ChatPrivateTypingRequestPayload"
    chatPrivateReadRequest:
      name: "chat:private:read"
      title: Recibo de leitura (pedido do cliente)
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ChatPrivateReadRequestPayload"
    chatMessage:
      name: "chat:message"
      title: Mensagem do chat público
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ChatMessagePayload"
    chatPrivateMessage:
      name: "chat:private:message"
      title: Mensagem do chat privado
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ChatPrivateMessagePayload"
    chatPrivateError:
      name: "chat:private:error"
      title: Conversa privada não permitida
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ChatPrivateErrorPayload"
    chatPrivateTypingRelay:
      name: "chat:private:typing"
      title: Digitando (chegando ao destinatário)
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ChatPrivateTypingRelayPayload"
    chatPrivateReadRelay:
      name: "chat:private:read"
      title: Recibo de leitura (chegando ao destinatário)
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ChatPrivateReadRelayPayload"
    chatGameInvite:
      name: "chat:game:invite"
      title: Convidar para Pong
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ChatGameInvitePayload"
    chatGameInviteResponse:
      name: "chat:game:invite:respond"
      title: Responder ao convite de Pong
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ChatGameInviteResponsePayload"
    chatGameInviteCancel:
      name: "chat:game:invite:cancel"
      title: Cancelar convite de Pong
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ChatGameInviteCancelPayload"
    chatGameInviteIncoming:
      name: "chat:game:invite"
      title: Convite de Pong recebido
      contentType: application/json
      payload:
        $ref: "#/components/schemas/GameInvitationPayload"
    chatGameInviteUpdate:
      name: "chat:game:invite:update"
      title: Estado do convite de Pong
      contentType: application/json
      payload:
        $ref: "#/components/schemas/GameInvitationPayload"
    friendsUpdate:
      name: "friends:update"
      title: Lista completa de amigos
      description: Substitui a lista inteira que o cliente mostra.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/FriendsUpdatePayload"
  schemas:
    QueueJoinPayload:
      title: Entrada na fila ou partida por convite
      type: object
      properties:
        inviteId:
          type: string
          description: Id de um convite de Pong aceito.
      additionalProperties: false
    EmptyPayload:
      title: Payload vazio
      description: Evento enviado sem dados; o payload chega como `{}`.
      type: object
      additionalProperties: true
    ChatGameInvitePayload:
      title: Pedido de convite de Pong
      type: object
      required:
        - otherUserId
      properties:
        otherUserId:
          type: integer
    ChatGameInviteResponsePayload:
      title: Resposta ao convite
      type: object
      required:
        - inviteId
        - accepted
      properties:
        inviteId:
          type: string
        accepted:
          type: boolean
    ChatGameInviteCancelPayload:
      title: Cancelar convite
      type: object
      required:
        - inviteId
      properties:
        inviteId:
          type: string
    GameInvitationPayload:
      title: Convite de Pong
      type: object
      required:
        - inviteId
        - senderId
        - senderNickname
        - recipientId
        - recipientNickname
        - status
      properties:
        inviteId:
          type: string
        senderId:
          type: integer
        senderNickname:
          type: string
        recipientId:
          type: integer
        recipientNickname:
          type: string
        status:
          type: string
          enum: [pending, accepted, declined, cancelled, started]
    PaddleInput:
      title: Input da raquete
      type: object
      required:
        - offset
        - sequence
      properties:
        offset:
          type: number
          description: Deslocamento desejado da raquete em relação ao centro.
        sequence:
          type: integer
          description: Número sequencial do input, obrigatório no parser.
    GameStatus:
      title: Estado da partida
      type: object
      required:
        - state
      properties:
        state:
          type: string
          enum:
            - playing
            - opponent_left
          description: |
            `playing` no início e no restart; `opponent_left` quando o
            adversário desconecta.
    GameSnapshot:
      title: Quadro da simulação
      type: object
      required:
        - leftPaddleOffset
        - rightPaddleOffset
        - ball
        - score
        - winner
        - timestamp
      properties:
        leftPaddleOffset:
          type: number
          description: Deslocamento da raquete esquerda.
        rightPaddleOffset:
          type: number
          description: Deslocamento da raquete direita.
        ball:
          type: object
          required:
            - x
            - z
          properties:
            x:
              type: number
            z:
              type: number
        score:
          type: object
          required:
            - left
            - right
          properties:
            left:
              type: integer
            right:
              type: integer
        winner:
          type:
            - string
            - "null"
          enum:
            - left
            - right
            - null
          description: Lado vencedor; `null` enquanto a partida não terminou.
        timestamp:
          type: number
          description: Momento do quadro, em milissegundos.
    GameError:
      title: Erro de jogo
      type: object
      required:
        - reason
        - message
      properties:
        reason:
          type: string
          enum:
            - already_playing
            - invalid
            - malformed
            - not_in_match
            - invalid_invitation
            - accepted_invitation
          description: |
            `already_playing` na fila com `queue:join` duplicado; `invalid`
            fora da fila, com input após o fim ou restart fora de `finished`;
            `malformed` em payload de input inválido; `not_in_match` para input
            ou restart sem partida; `invalid_invitation` para convite ausente,
            não aceito ou de outra pessoa; `accepted_invitation` quando há uma
            partida aceita e é necessário entrar pelo chat.
        message:
          type: string
          description: Texto legível em português.
    ChatSendPayload:
      title: Envio no chat público
      type: object
      required:
        - text
      properties:
        text:
          type: string
          description: Texto da mensagem; o servidor corta os espaços das bordas e descarta vazio.
    ChatPrivateSendPayload:
      title: Envio no chat privado
      type: object
      required:
        - otherUserId
        - text
      properties:
        otherUserId:
          type: integer
          description: Id do destinatário; funciona só entre amigos.
        text:
          type: string
          description: Texto da mensagem; o servidor corta os espaços das bordas e descarta vazio.
    ChatPrivateTypingRequestPayload:
      title: Digitando, enviado pelo cliente
      type: object
      required:
        - otherUserId
        - isTyping
      properties:
        otherUserId:
          type: integer
          description: Id do destinatário.
        isTyping:
          type: boolean
          description: Verdadeiro enquanto a pessoa digita.
    ChatPrivateReadRequestPayload:
      title: Recibo de leitura, enviado pelo cliente
      type: object
      required:
        - otherUserId
        - lastMessageId
      properties:
        otherUserId:
          type: integer
          description: Id do destinatário.
        lastMessageId:
          type: string
          description: Id da última mensagem lida.
    ChatMessagePayload:
      title: Mensagem de chat
      description: |
        Formato comum ao chat público e ao privado; `id` é o id numérico do
        banco em texto e `createdAt` é o momento do envio em milissegundos
        desde 1970. Em mensagens públicas, os campos privados não aparecem.
      type: object
      required:
        - id
        - userId
        - nickname
        - text
        - createdAt
      properties:
        id:
          type: string
          description: Id da mensagem no banco, em texto.
        userId:
          type: integer
          description: Id de quem enviou.
        nickname:
          type: string
          description: Apelido de quem enviou, lido na hora.
        avatarUrl:
          type:
            - string
            - "null"
          description: Endereço da foto de quem enviou, ou `null`.
        text:
          type: string
          description: Conteúdo da mensagem.
        createdAt:
          type: integer
          description: Momento do envio, em milissegundos desde 1970.
    ChatPrivateMessagePayload:
      title: Mensagem de chat privado
      type: object
      allOf:
        - $ref: "#/components/schemas/ChatMessagePayload"
        - type: object
          required:
            - otherUserId
            - conversationId
          properties:
            otherUserId:
              type: integer
              description: |
                Destinatário de quem enviou; como o mesmo objeto chega aos
                dois lados, quem recebe deduz o par pelo campo `userId`.
            conversationId:
              type: string
              description: 'Id da conversa em "menor id:maior id".'
    ChatPrivateErrorPayload:
      title: Conversa privada não permitida
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: "Não é possível enviar mensagem privada: vocês ainda não são amigos."
    ChatPrivateTypingRelayPayload:
      title: Digitando, chegando ao destinatário
      type: object
      required:
        - userId
        - nickname
        - conversationId
        - isTyping
      properties:
        userId:
          type: integer
          description: Id de quem digita.
        nickname:
          type: string
          description: Apelido de quem digita, na hora do pedido.
        conversationId:
          type: string
          description: 'Id da conversa em "menor id:maior id".'
        isTyping:
          type: boolean
          description: Verdadeiro enquanto a pessoa digita.
    ChatPrivateReadRelayPayload:
      title: Recibo de leitura, chegando ao destinatário
      type: object
      required:
        - userId
        - conversationId
        - lastMessageId
      properties:
        userId:
          type: integer
          description: Id de quem leu.
        conversationId:
          type: string
          description: 'Id da conversa em "menor id:maior id".'
        lastMessageId:
          type: string
          description: Última mensagem lida pela outra pessoa.
    FriendPayload:
      title: Amigo na lista de presença
      type: object
      required:
        - id
        - nickname
        - avatarUrl
        - online
        - status
        - relation
      properties:
        id:
          type: integer
          description: Id da pessoa amiga.
        nickname:
          type: string
          description: Apelido lido na hora.
        avatarUrl:
          type:
            - string
            - "null"
          description: Endereço da foto, ou `null`.
        online:
          type: boolean
          description: Verdadeiro quando a pessoa tem ao menos uma conexão com sessão.
        status:
          type: string
          enum:
            - pending
            - accepted
          description: Situação do vínculo, convite em espera ou amizade.
        relation:
          type: string
          enum:
            - outgoing
            - incoming
