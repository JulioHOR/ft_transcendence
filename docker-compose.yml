networks:
  ft_transcendence:

volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/ft_transcendence/postgres

secrets:
  db_password:
    file: ./secrets/db_password.txt
  flask_secret_key:
    file: ./secrets/flask_secret_key.txt
  backend_tls_certificate:
    file: ./secrets/backend.crt
  backend_tls_key:
    file: ./secrets/backend.key

services:
  database:
    build:
      context: ./database
      dockerfile: Dockerfile
    networks:
      - ft_transcendence
    volumes:
      - postgres_data:/var/lib/postgresql/data
    secrets:
      - db_password
    environment:
      POSTGRES_INTERNAL_PORT: ${POSTGRES_INTERNAL_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    networks:
      - ft_transcendence
    user: "0:0"
    secrets:
      - db_password
      - flask_secret_key
      - backend_tls_certificate
      - backend_tls_key
    environment:
      API_KEY: ${API_KEY:?API_KEY é obrigatória no .env}
      BACKEND_INTERNAL_PORT: ${BACKEND_INTERNAL_PORT}
      POSTGRES_INTERNAL_PORT: ${POSTGRES_INTERNAL_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_HOST: database
    depends_on:
      - database
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONT_PUBLIC_PORT}:${FRONTEND_INTERNAL_PORT}"
    networks:
      - ft_transcendence
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
      FRONTEND_INTERNAL_PORT: ${FRONTEND_INTERNAL_PORT}
      BACKEND_INTERNAL_PORT: ${BACKEND_INTERNAL_PORT}
      LAN_IP: ${LAN_IP:-}
    secrets:
      - backend_tls_certificate
    depends_on:
      - backend
      - game
    restart: unless-stopped

  game:
    build:
      context: ./3D-Environment
      dockerfile: Dockerfile
    networks:
      - ft_transcendence
    secrets:
      - backend_tls_certificate
    environment:
      NODE_ENV: production
      BACKEND_INTERNAL_PORT: ${BACKEND_INTERNAL_PORT}
      NODE_EXTRA_CA_CERTS: /run/secrets/backend_tls_certificate
    depends_on:
      - backend
    restart: unless-stopped
