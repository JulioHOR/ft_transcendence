# Basic configuration for how Nginx behaves
user www-data; # Defines the user that Nginx runs as
worker_processes auto; # Defines the number of Nginx worker processes
# "auto" adjusts automatically based on the number of available CPU cores.
pid /run/nginx.pid; # Defines the Nginx PID (Process ID) file
# It is used to manage the server's main process.


events { # Handles network connections and asynchronous events.
    worker_connections 1024; # Defines the maximum number of simultaneous connections each worker can handle.
}

http {
    include       /etc/nginx/mime.types; # Defines MIME types for different file extensions.
    client_max_body_size 1m; # Defines the maximum HTTP request body size Nginx accepts.

    resolver 127.0.0.11 valid=10s ipv6=off; # Defines the DNS resolver for Nginx. It resolves domain names to IP addresses.
    # 127.0.0.11 = Docker's internal DNS resolver IP address. (Made available by Docker when creating a bridge network)

    server {
        listen ${FRONTEND_INTERNAL_PORT} ssl; # Defines the port Nginx listens on for HTTPS connections.
        server_name ${DOMAIN_NAME}; # Defines the server name (domain) Nginx responds to.

        ssl_certificate     /etc/nginx/ssl/nginx.crt; # Defines the path to the SSL certificate used to encrypt HTTPS connections.
        ssl_certificate_key /etc/nginx/ssl/nginx.key; # Defines the path to the SSL certificate's private key.
        ssl_protocols       TLSv1.2 TLSv1.3; # Defines the SSL/TLS protocols supported by Nginx.

        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000" always;

        root  /var/www/html; # Defines the root directory containing the website files.
        index index.html; # Defines the default file served when a directory is accessed.

        location / { # Defines the configuration for the website's root location.
            # Attempts to serve the requested file. If it is not found, attempts to serve a directory.
            try_files $uri $uri/ /index.html;
        }

        location /api/ { # Defines the configuration for the website's /api/ location.
            set $backend_upstream backend;
            proxy_pass https://$backend_upstream:${BACKEND_INTERNAL_PORT};
            proxy_ssl_server_name on;
            proxy_ssl_name backend;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /run/secrets/backend_tls_certificate;
            proxy_ssl_verify_depth 1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-API-Key $http_x_api_key;
        }

        location = /game { # Prevents our asset paths from breaking
            return 301 /game/;
        }

        location /game/ {
            set $game_upstream game;
            rewrite ^/game/(.*)$ /$1 break;
            proxy_pass http://$game_upstream:2567; # Port fixed by Colyseus
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /socket.io/ { # Defines the configuration for the website's /socket.io/ location, used for WebSockets.
            set $backend_upstream backend;
            proxy_pass https://$backend_upstream:${BACKEND_INTERNAL_PORT};
            proxy_ssl_server_name on;
            proxy_ssl_name backend;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /run/secrets/backend_tls_certificate;
            proxy_ssl_verify_depth 1;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
