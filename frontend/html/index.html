<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ft_transcendence</title>
</head>
<body>
  <h1>ft_transcendence</h1>

  <p>
    <input id="send-input" type="text" placeholder="mensagem">
    <button id="send-btn" type="button">Enviar</button>
  </p>

  <p>
    <input id="get-input" type="text" readonly>
    <button id="get-btn" type="button">Obter</button>
  </p>

  <script>
    document.getElementById("send-btn").onclick = async function () {
      const content = document.getElementById("send-input").value;
      await fetch("/api/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ content: content })
      });
      document.getElementById("send-input").value = "";
    };

    document.getElementById("get-btn").onclick = async function () {
      const res = await fetch("/api/messages");
      const data = await res.json();
      document.getElementById("get-input").value = data.map(function (m) {
        return m.id + ": " + m.content;
      }).join(" | ");
    };
  </script>
</body>
</html>
